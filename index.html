<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Messenger</title><meta name="theme-color" content="#101522"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b1020;--p:#141d30;--line:#29344b;--t:#f3f6ff;--m:#a1afc7;--a:#8a75ff;--b:#62d6c5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top left,#28264a,#0b1020 55%);color:var(--t);font-family:Inter,system-ui}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth{width:min(460px,100%);padding:30px;background:#141d30ee;border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 90px #0007}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.logo,.avatar{display:grid;place-items:center;border-radius:14px;background:linear-gradient(130deg,var(--a),var(--b));color:#101522;font-weight:800}.logo{width:45px;height:45px;font-size:22px}.brand h1{font-size:20px;margin:0}.muted{color:var(--m)}h2{margin:0 0 8px}.tabs{display:flex;background:#0c1323;border-radius:12px;padding:4px;margin:22px 0}.tabs button{flex:1;border:0;padding:10px;border-radius:9px;background:transparent;color:var(--m)}.tabs button.on{background:#202b43;color:var(--t)}label{display:block;font-size:13px;color:var(--m);margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#0b1222;color:var(--t);font:inherit;outline:none}input:focus{border-color:var(--a)}button{cursor:pointer;font:inherit}.primary,.secondary{width:100%;padding:13px;border-radius:12px;margin-top:10px;font-weight:700}.primary{background:linear-gradient(130deg,var(--a),#6e9cff);border:0;color:white}.secondary{background:#202b43;border:1px solid var(--line);color:var(--t)}.error{color:#ff9eae;margin-top:12px;font-size:13px}.app{display:none;width:min(1100px,100%);height:min(850px,92vh);background:var(--p);border:1px solid var(--line);border-radius:22px;overflow:hidden;grid-template-columns:300px 1fr}.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.sidehead,.head{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.sidehead{justify-content:space-between}.people,.msgs{overflow:auto;flex:1;padding:12px}.person{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;border-radius:12px;color:var(--t);background:transparent;text-align:left}.person:hover{background:#202b43}.avatar{width:40px;height:40px;flex:none;border-radius:50%}.chat{display:flex;flex-direction:column;min-width:0}.msgs{display:flex;flex-direction:column;gap:9px}.bubble{max-width:75%;padding:11px 14px;background:#202b43;border-radius:16px;overflow-wrap:anywhere;align-self:flex-start}.bubble.mine{align-self:flex-end;background:#6255bb}.time{font-size:10px;opacity:.65;margin-top:5px}.compose{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px}.compose input{flex:1}.compose button{width:48px;border:0;border-radius:12px;background:var(--a);color:white}.welcome{margin:auto;text-align:center;color:var(--m)}@media(max-width:680px){.wrap{padding:0}.auth{border-radius:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center}.app{height:100vh;border-radius:0;grid-template-columns:1fr}.side{display:none}.chat{display:flex}}
</style></head><body><div class="wrap"><section class="auth" id="auth"><div class="brand"><div class="logo">O</div><div><h1>Orbit Messenger</h1><small class="muted">Stay close, wherever you are.</small></div></div><h2 id="heading">Welcome back</h2><p class="muted">Sign in to start real conversations.</p><div class="tabs"><button class="on" data-mode="email">Email</button><button data-mode="phone">Phone</button></div><div id="email"><label>Email address</label><input id="em" type="email" placeholder="you@example.com"><label>Password</label><input id="pw" type="password" placeholder="Password"><button class="primary" id="login">Sign in</button><button class="secondary" id="signup">Create account</button></div><div id="phone" hidden><label>Phone number (international format)</label><input id="ph" type="tel" placeholder="+212..."><button class="primary" id="sendotp">Send SMS code</button><div id="otpbox" hidden><label>SMS verification code</label><input id="otp" inputmode="numeric"><button class="primary" id="verify">Verify</button></div></div><button class="secondary" id="google">Continue with Google</button><p class="muted" style="font-size:12px">Configure providers in Supabase. No sample conversations are included.</p><div class="error" id="error"></div></section><section class="app" id="app"><aside class="side"><div class="sidehead"><strong>Orbit · People</strong><button id="logout" class="secondary" style="width:auto;margin:0;padding:8px">Sign out</button></div><input id="search" placeholder="Search people…" style="margin:12px;width:calc(100% - 24px)"><div class="people" id="people"></div></aside><main class="chat"><div class="head"><div class="avatar" id="av">O</div><div><strong id="name">Orbit</strong><div class="muted" id="subtitle">Select a person</div></div></div><div class="msgs" id="msgs"><div class="welcome"><h2>Welcome to Orbit</h2><p>Select someone to begin.</p></div></div><form class="compose" id="form"><input id="message" placeholder="Message…" disabled><button id="send" disabled>➤</button></form></main></section></div><script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const URL="YOUR_SUPABASE_URL",KEY="YOUR_SUPABASE_ANON_KEY",ready=!URL.startsWith("YOUR_")&&!KEY.startsWith("YOUR_"),db=ready?createClient(URL,KEY):null,$=id=>document.getElementById(id);let me=null,selected=null,users=[],channel=null;
function err(s){$("error").textContent=s||""}function initials(s){return(s||"User").split(/\\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function run(fn){err("");if(!ready){err("Configure Supabase URL and anon key in index.html first.");return}try{await fn()}catch(e){err(e.message)}}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));$("email").hidden=b.dataset.mode!=="email";$("phone").hidden=b.dataset.mode!=="phone"});
$("login").onclick=()=>run(async()=>{let{data,error}=await db.auth.signInWithPassword({email:$("em").value,password:$("pw").value});if(error)throw error;if(data.user)start(data.user)});
$("signup").onclick=()=>run(async()=>{let{data,error}=await db.auth.signUp({email:$("em").value,password:$("pw").value,options:{data:{display_name:$("em").value.split("@")[0]}}});if(error)throw error;if(data.session)start(data.user);else err("Check your email to confirm signup.")});
$("sendotp").onclick=()=>run(async()=>{let{error}=await db.auth.signInWithOtp({phone:$("ph").value});if(error)throw error;$("otpbox").hidden=false;err("SMS sent.")});
$("verify").onclick=()=>run(async()=>{let{data,error}=await db.auth.verifyOtp({phone:$("ph").value,token:$("otp").value,type:"sms"});if(error)throw error;if(data.user)start(data.user)});
$("google").onclick=()=>run(async()=>{let{error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}});if(error)throw error});
async function start(u){me=u;$("auth").style.display="none";$("app").style.display="grid";let{data:p}=await db.from("profiles").select("id").eq("id",u.id).maybeSingle();if(!p)await db.from("profiles").upsert({id:u.id,display_name:u.user_metadata?.display_name||u.email?.split("@")[0]||"Member"});await loadUsers()}
async function loadUsers(){let{data,error}=await db.from("profiles").select("id,display_name").neq("id",me.id).order("display_name");if(error){err(error.message);return}users=data||[];renderUsers(users)}
function renderUsers(a){$("people").innerHTML=a.map(p=>'<button class="person" data-id="'+p.id+'"><div class="avatar">'+initials(p.display_name)+'</div>'+safe(p.display_name)+'</button>').join("")||'<p class="muted">No other accounts yet.</p>';document.querySelectorAll(".person").forEach(b=>b.onclick=()=>open(users.find(p=>p.id===b.dataset.id)))}
$("search").oninput=e=>renderUsers(users.filter(p=>(p.display_name||"").toLowerCase().includes(e.target.value.toLowerCase())));
async function open(p){selected=p;$("name").textContent=p.display_name||"Member";$("av").textContent=initials(p.display_name);$("subtitle").textContent="Direct message";$("message").disabled=$("send").disabled=false;await loadMsgs();if(channel)db.removeChannel(channel);channel=db.channel("orbit-"+me.id+"-"+p.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},()=>loadMsgs()).subscribe()}
async function loadMsgs(){if(!selected)return;let{data,error}=await db.from("messages").select("*").or("and(sender_id.eq."+me.id+",receiver_id.eq."+selected.id+"),and(sender_id.eq."+selected.id+",receiver_id.eq."+me.id+")").order("created_at");if(error){err(error.message);return}$("msgs").innerHTML=(data||[]).map(m=>'<div class="bubble '+(m.sender_id===me.id?"mine":"")+'">'+safe(m.content)+'<div class="time">'+new Date(m.created_at).toLocaleString()+'</div></div>').join("")||'<div class="welcome">Say hello 👋</div>';$("msgs").scrollTop=$("msgs").scrollHeight}
$("form").onsubmit=async e=>{e.preventDefault();let s=$("message").value.trim();if(!s||!selected)return;let{error}=await db.from("messages").insert({sender_id:me.id,receiver_id:selected.id,content:s});if(error)err(error.message);else{$("message").value="";loadMsgs()}};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
if(ready){let{data:{session}}=await db.auth.getSession();if(session)await start(session.user);db.auth.onAuthStateChange((_e,s)=>{if(s&&!me)start(s.user)})}
</script></body></html>
