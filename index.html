<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Messenger</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111a2e;--line:#24324d;--text:#e8efff;--muted:#9aaccc;--accent:#8b7cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#202d50,var(--bg) 45%);color:var(--text);font:15px system-ui;min-height:100vh}.app{max-width:1200px;height:100dvh;margin:auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:14px}.pane{background:#111a2eee;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-height:0}.head{padding:18px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}small,.muted{color:var(--muted)}input,button{font:inherit;color:inherit}input{background:#0b1325;border:1px solid var(--line);padding:12px;border-radius:12px;width:100%;outline:none}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#25314a}button:hover{filter:brightness(1.1)}.row{display:flex;gap:8px}.list{overflow:auto;flex:1;padding:8px}.entry{padding:12px;border-radius:14px;cursor:pointer;display:flex;gap:12px;align-items:center}.entry:hover,.entry.active{background:#22304a}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#8b7cff,#38c7b6);display:grid;place-items:center;font-weight:800}.body{flex:1;min-width:0}.entry strong,.entry small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chathead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:75%;padding:11px 14px;background:#26334b;border-radius:18px 18px 18px 5px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#695ed1;border-radius:18px 18px 5px 18px}.meta{font-size:11px;opacity:.65;margin-top:4px}.compose{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}.compose input{flex:1}.blank{margin:auto;text-align:center;color:var(--muted);padding:24px}.auth{max-width:480px;margin:7vh auto;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:20px;display:grid;gap:12px}.auth h1{margin-bottom:4px}.hidden{display:none!important}.settings{padding:20px;overflow:auto;display:grid;gap:12px}.settings label{display:grid;gap:6px}.note{background:#1c2942;border-radius:12px;padding:12px;color:var(--muted)}@media(max-width:760px){.app{padding:0;display:block;height:100dvh}.pane{border-radius:0;border:0;height:100dvh}.chatpane{display:none}.app.chatopen .listpane{display:none}.app.chatopen .chatpane{display:flex}.chathead .back{display:inline-block}.app:not(.chatopen) .chatpane{display:none}}
</style></head><body>
<div id="auth" class="auth"><h1>Orbit Messenger</h1><p class="muted">Sign in or create your account.</p><label>Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label><div class="row"><button id="signin">Sign in</button><button id="signup" class="secondary">Create account</button></div><button id="google" class="secondary">Continue with Google</button><div class="note">If your Supabase connection isn't configured yet, add your Project URL and Publishable key in the connection setup below.</div><details><summary>Connection setup</summary><label>Supabase Project URL<input id="url" placeholder="https://your-project.supabase.co"></label><label>Publishable key<input id="key" placeholder="sb_publishable_..."></label><button id="saveconfig">Save connection</button></details><div id="authmsg" class="muted"></div></div>
<div id="app" class="app hidden"><aside class="pane listpane"><div class="head"><div class="row" style="align-items:center;justify-content:space-between"><h1>Orbit</h1><button id="settings" class="secondary">⚙</button></div><p id="who" class="muted"></p><input id="search" placeholder="Search people or chats…" style="margin-top:12px"></div><div id="list" class="list"></div><div class="head"><button id="logout" class="secondary" style="width:100%">Sign out</button></div></aside><section class="pane chatpane"><div id="chathead" class="chathead"><div class="blank">Choose a chat or search for someone.</div></div><div id="messages" class="messages"><div class="blank">Your messages will appear here.</div></div><form id="compose" class="compose hidden"><input id="text" placeholder="Write a message…" autocomplete="off"><button>Send</button></form></section></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id);let sb=null,user=null,active=null,channel=null,people=[],chats=[];
const cfg=()=>({url:$('url').value.trim()||localStorage.getItem('orbit-url')||'',key:$('key').value.trim()||localStorage.getItem('orbit-key')||''});
function connect(){const c=cfg();if(!c.url||!c.key)throw new Error('Enter your Supabase URL and publishable key.');sb=createClient(c.url,c.key);}
function say(t){$('authmsg').textContent=t}
function initials(n){return (n||'?').split(/[\s@]+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function boot(){try{if(!sb)connect();const {data:{session}}=await sb.auth.getSession();if(session){user=session.user;showApp();await loadChats()}}catch(e){say(e.message)}}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email||user.id}
async function authAction(fn){try{connect();say('');await fn()}catch(e){say(e.message||String(e))}}
$('url').value=localStorage.getItem('orbit-url')||'';$('key').value=localStorage.getItem('orbit-key')||'';$('saveconfig').onclick=async()=>{try{const c={url:$('url').value.trim().replace(/\\/$/,''),key:$('key').value.trim()};if(!/^https:\\/\\/[^\\s]+\\.supabase\\.co$/.test(c.url))throw new Error('Project URL must look like https://YOUR_PROJECT.supabase.co (no /rest/v1).');if(!c.key.startsWith('sb_publishable_')&&!c.key.startsWith('eyJ'))throw new Error('Paste your Supabase Publishable key (not a Secret key).');localStorage.setItem('orbit-url',c.url);localStorage.setItem('orbit-key',c.key);sb=createClient(c.url,c.key);say('Saved. Testing Supabase connection…');const r=await fetch(c.url+'/auth/v1/health',{headers:{apikey:c.key}});if(!r.ok)throw new Error('Supabase health check returned HTTP '+r.status+'. Check that URL and key belong to the same project.');say('Supabase connection verified. You can now create an account or sign in.');}catch(e){say(e.message||String(e));}};
$('signin').onclick=()=>authAction(async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;user=data.user;showApp();await loadChats()});
$('signup').onclick=()=>authAction(async()=>{const {data,error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});if(error)throw error;user=data.user;if(data.session){showApp();await loadChats()}else say('Account created. Check your email for the confirmation link.')});
$('google').onclick=()=>authAction(async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)throw error});
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('settings').onclick=()=>{const url=prompt('Supabase project URL',localStorage.getItem('orbit-url')||'');if(url===null)return;const key=prompt('Supabase publishable key',localStorage.getItem('orbit-key')||'');if(key===null)return;localStorage.setItem('orbit-url',url.trim());localStorage.setItem('orbit-key',key.trim());alert('Saved. Reload to use the updated connection.')};
async function loadChats(){try{const {data:members,error}=await sb.from('conversation_members').select('conversation_id').eq('user_id',user.id);if(error)throw error;const ids=[...new Set((members||[]).map(x=>x.conversation_id))];chats=[];if(ids.length){const {data:rows,error:e}=await sb.from('conversations').select('id,created_at').in('id',ids).order('created_at',{ascending:false});if(e)throw e;for(const c of rows||[]){const {data:mem}=await sb.from('conversation_members').select('user_id').eq('conversation_id',c.id);const other=(mem||[]).find(m=>m.user_id!==user.id);let profile=null;if(other){const {data:p}=await sb.from('profiles').select('id,username,display_name,avatar_url').eq('id',other.user_id).maybeSingle();profile=p}const {data:last}=await sb.from('messages').select('content,created_at').eq('conversation_id',c.id).order('created_at',{ascending:false}).limit(1);chats.push({id:c.id,profile,last:last?.[0]})}}renderList();}catch(e){$('list').innerHTML='<div class="blank">'+esc(e.message)+'</div>'}}
function renderList(){const q=$('search').value.trim().toLowerCase();$('list').innerHTML=chats.filter(c=>(c.profile?.display_name||c.profile?.username||'Unknown').toLowerCase().includes(q)).map(c=>'<div class="entry '+(active===c.id?'active':'')+'" data-id="'+c.id+'"><div class="avatar">'+esc(initials(c.profile?.display_name||c.profile?.username))+'</div><div class="body"><strong>'+esc(c.profile?.display_name||c.profile?.username||'User')+'</strong><small>'+esc(c.last?.content||'No messages yet')+'</small></div></div>').join('')+(!q?'':'') ;$('list').querySelectorAll('.entry').forEach(el=>el.onclick=()=>openChat(el.dataset.id))}
$('search').addEventListener('input',async()=>{const q=$('search').value.trim();if(q.length>=2){try{const {data,error}=await sb.from('profiles').select('id,username,display_name,avatar_url').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(15);if(error)throw error;people=(data||[]).filter(p=>p.id!==user.id);renderSearchResults()}catch(e){}}else renderList()});
function renderSearchResults(){const q=$('search').value.trim();$('list').innerHTML='<div class="muted" style="padding:8px">People</div>'+people.map(p=>'<div class="entry" data-user="'+p.id+'"><div class="avatar">'+esc(initials(p.display_name||p.username))+'</div><div class="body"><strong>'+esc(p.display_name||p.username||'User')+'</strong><small>@'+esc(p.username||'user')+'</small></div></div>').join('');$('list').querySelectorAll('[data-user]').forEach(el=>el.onclick=()=>startConversation(el.dataset.user)) }
async function startConversation(other){try{const {data,error}=await sb.rpc('create_direct_conversation',{other_user:other});if(error)throw error;active=data;await loadChats();openChat(active)}catch(e){alert('Could not start chat: '+e.message)}}
async function openChat(id){active=id;const c=chats.find(x=>x.id===id);$('app').classList.add('chatopen');$('chathead').innerHTML='<button class="secondary back" id="back">←</button><div class="avatar">'+esc(initials(c?.profile?.display_name||c?.profile?.username))+'</div><div><strong>'+esc(c?.profile?.display_name||c?.profile?.username||'Chat')+'</strong><small class="muted">Orbit Messenger</small></div>'; $('back').onclick=()=>{$('app').classList.remove('chatopen')};$('compose').classList.remove('hidden');await loadMessages();if(channel)sb.removeChannel(channel);channel=sb.channel('messages-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},payload=>{if(payload.new.sender_id!==user.id)loadMessages()}).subscribe()}
async function loadMessages(){try{const {data,error}=await sb.from('messages').select('id,sender_id,content,created_at').eq('conversation_id',active).order('created_at',{ascending:true});if(error)throw error;$('messages').innerHTML=(data||[]).map(m=>'<div class="bubble '+(m.sender_id===user.id?'mine':'')+'">'+esc(m.content)+'<div class="meta">'+new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div></div>').join('')||'<div class="blank">Say hello 👋</div>';$('messages').scrollTop=$('messages').scrollHeight}catch(e){$('messages').innerHTML='<div class="blank">'+esc(e.message)+'</div>'}}
$('compose').onsubmit=async e=>{e.preventDefault();const content=$('text').value.trim();if(!content||!active)return;try{const {error}=await sb.from('messages').insert({conversation_id:active,sender_id:user.id,content});if(error)throw error;$('text').value='';await loadMessages();await loadChats()}catch(e){alert('Message failed: '+e.message)}};
sb?.auth?.onAuthStateChange((event,session)=>{if(session&&session.user){user=session.user}});
boot();
</script></body></html>
