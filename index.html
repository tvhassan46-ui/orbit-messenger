<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: chat column with bottom tabs | conversation | details */
:root{
  --ah:258;
  --app-bg:#f4f3f6; --app-solid:#ffffff; --app-panel:#ffffff; --app-soft:#f4f3f5;
  --app-fg:#0f0e13; --app-muted:#5f6069; --app-line:#dcdbe1;
  --app-accent:hsl(var(--ah) 64% 48%); --app-on-accent:#ffffff; --app-accent-soft:hsl(var(--ah) 92% 93%); --app-accent-strong:hsl(var(--ah) 62% 28%);
  --app-mine:hsl(var(--ah) 92% 93%); --app-on-mine:#141020; --app-theirs:#f2f1f4;
  --app-danger:#c62f45; --app-shadow:0 4px 18px rgba(25,18,50,.16);
  --font-ui:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --scale:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --app-bg:#0e0d12; --app-solid:#15141b; --app-panel:#15141b; --app-soft:#22202a;
  --app-fg:#ecebf1; --app-muted:#a3a1ae; --app-line:#34323e;
  --app-accent:hsl(var(--ah) 85% 76%); --app-on-accent:hsl(var(--ah) 55% 12%); --app-accent-soft:hsl(var(--ah) 34% 25%); --app-accent-strong:hsl(var(--ah) 90% 90%);
  --app-mine:hsl(var(--ah) 36% 28%); --app-on-mine:#f3f1fa; --app-theirs:#22202a;
  --app-danger:#ff7b8c; --app-shadow:0 4px 18px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --app-bg:#0e0d12; --app-solid:#15141b; --app-panel:#15141b; --app-soft:#22202a;
  --app-fg:#ecebf1; --app-muted:#a3a1ae; --app-line:#34323e;
  --app-accent:hsl(var(--ah) 85% 76%); --app-on-accent:hsl(var(--ah) 55% 12%); --app-accent-soft:hsl(var(--ah) 34% 25%); --app-accent-strong:hsl(var(--ah) 90% 90%);
  --app-mine:hsl(var(--ah) 36% 28%); --app-on-mine:#f3f1fa; --app-theirs:#22202a;
  --app-danger:#ff7b8c; --app-shadow:0 4px 18px rgba(0,0,0,.55);
  color-scheme:dark}
:root.hc{--app-muted:var(--app-fg);--app-line:color-mix(in srgb,var(--app-fg) 45%,transparent)}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--app-bg);color:var(--app-fg);font-family:var(--font-ui);font-size:calc(14px * var(--scale));line-height:1.45;overflow:hidden;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--app-accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,p{margin:0;text-wrap:balance}

.app{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:12px;height:100%;max-width:1320px;margin:0 auto}
.app.details-open{grid-template-columns:minmax(300px,360px) minmax(0,1fr) 300px}
.pane{background:var(--app-panel);border:1px solid var(--app-line);border-radius:20px;min-height:0;min-width:0;display:flex;flex-direction:column}

/* floating buttons and bottom tabs */
.list{position:relative;overflow:hidden}
.floating{position:absolute;right:16px;bottom:96px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:3}
.fab{width:60px;height:60px;border-radius:18px;background:var(--app-accent);color:var(--app-on-accent);display:grid;place-items:center;box-shadow:var(--app-shadow);transition:transform .2s}
.fab:hover{transform:scale(1.05)}
.fab svg.i{width:28px;height:28px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--app-line);padding:10px 4px 8px}
.tab{display:grid;justify-items:center;gap:5px;min-width:0;font-size:.9em;font-weight:500}
.tab .ico{position:relative;width:62px;max-width:100%;height:32px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tab svg.i{width:24px;height:24px}
.tab:hover .ico{background:var(--app-soft)}
.tab[aria-current="page"]{font-weight:800}
.tab[aria-current="page"] .ico{background:var(--app-accent-soft);color:var(--app-accent-strong)}
.tab[aria-current="page"] svg.i{stroke-width:2.4}
.dot{position:absolute;top:4px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--app-accent)}

/* list pane */
.list-head{padding:14px 14px 8px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
h1{font-size:1.55em;font-weight:800;letter-spacing:-.025em}
h2{font-size:1.15em;font-weight:700;letter-spacing:-.01em}
.label{font-family:var(--font-mono);font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--app-muted)}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--app-muted);flex:none;transition:background .15s,color .15s}
.ib:hover,.ib[aria-pressed="true"]{background:var(--app-soft);color:var(--app-fg)}
.search{display:flex;align-items:center;gap:12px;background:var(--app-soft);border-radius:99px;padding:3px 16px;color:var(--app-muted);border:1px solid transparent}
.search:focus-within{border-color:var(--app-accent)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:10px 0;color:var(--app-fg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chip{padding:6px 15px;border-radius:99px;border:1px solid var(--app-line);font-size:.98em;font-weight:500;color:var(--app-muted);white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--app-accent-soft);border-color:color-mix(in srgb,var(--app-accent) 28%,transparent);color:var(--app-accent-strong)}
.scroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--app-line) transparent}
#listBody{padding:4px 6px 150px}
.view-settings #listBody,.view-starred #listBody{padding-bottom:12px}
.view-settings .floating,.view-starred .floating{display:none}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:11px 8px;border-radius:14px;text-align:left;position:relative}
.item:hover{background:var(--app-soft)}
.item.active{background:var(--app-soft)}
.item .open{position:absolute;inset:0;border-radius:16px;width:100%}
.item .more{position:relative;z-index:1;width:26px;height:22px;opacity:0;border-radius:8px}
.item:hover .more,.item .more:focus-visible{opacity:1}
@media (hover:none){.item .more{opacity:.7}}
.item .body{flex:1;min-width:0}
.line1,.line2{display:flex;align-items:center;gap:6px;min-width:0}
.name{font-weight:500;font-size:1.1em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:.82em;color:var(--app-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.preview{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--app-muted);font-size:1.02em}
.preview svg.i{width:16px;height:16px;vertical-align:-3px}
.preview.typing{color:var(--app-accent);font-weight:600}
.pill{min-width:20px;height:20px;border-radius:99px;background:var(--app-accent);color:var(--app-on-accent);font-size:.72em;font-weight:800;display:grid;place-items:center;padding:0 6px}
.mini svg.i{width:14px;height:14px;color:var(--app-muted)}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:.95em;color:#fff;position:relative;background:linear-gradient(145deg,hsl(var(--h) 62% 52%),hsl(calc(var(--h) + 22) 58% 38%));text-shadow:0 1px 2px rgba(0,0,0,.25)}
.avatar.online::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--app-accent);border:2px solid var(--app-solid)}
.avatar.sm{width:34px;height:34px;font-size:.78em}
.avatar.lg{width:96px;height:96px;font-size:1.7em}
.avatar.anon{background:var(--app-accent-soft);color:var(--app-accent-strong);text-shadow:none}
.avatar.anon svg.i{width:55%;height:55%;fill:currentColor}
.avatar.ring{outline:2px solid var(--app-accent);outline-offset:3px}
.avatar.ring.seen{outline-color:var(--app-line)}
.empty{padding:36px 18px;text-align:center;color:var(--app-muted);display:grid;gap:10px;justify-items:center}
.section-label{padding:14px 10px 6px}
.list-foot{padding:12px 16px;display:flex;justify-content:center}

/* conversation */
.main{overflow:hidden;position:relative}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--app-line)}
.chat-head .who{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.sub{font-size:.85em;color:var(--app-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.back{display:none}
.chat-search{padding:8px 14px;border-bottom:1px solid var(--app-line)}
.msgs{padding:18px max(16px,4%);display:flex;flex-direction:column;gap:4px}
.wall-dots .msgs{background-image:radial-gradient(var(--app-line) 1.2px,transparent 1.3px);background-size:20px 20px}
.wall-grid .msgs{background-image:linear-gradient(var(--app-line) 1px,transparent 1px),linear-gradient(90deg,var(--app-line) 1px,transparent 1px);background-size:32px 32px}
.msgs>:first-child{margin-top:auto}
.day,.system{align-self:center;padding:4px 12px;border-radius:99px;background:var(--app-solid);border:1px solid var(--app-line);margin:12px 0 8px;text-align:center}
.system{font-size:.82em;color:var(--app-muted)}
.msg{display:flex;align-items:center;gap:4px;max-width:min(78%,560px);align-self:flex-start}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.react{margin-bottom:14px}
.bubble{position:relative;background:var(--app-theirs);border-radius:18px 18px 18px 6px;padding:8px 12px 6px;min-width:0;overflow-wrap:anywhere;animation:rise .25s ease-out}
.msg:not(.fresh) .bubble{animation:none}
.mine .bubble{background:var(--app-mine);color:var(--app-on-mine);border-radius:18px 18px 6px 18px}
.bubble.hit{outline:2px solid #e8a317;outline-offset:2px}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.text{white-space:pre-wrap}
.text a{color:inherit}
.deleted{font-style:italic;opacity:.75}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-family:var(--font-mono);font-size:.66em;opacity:.78;margin-top:2px}
.ticks{width:17px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ticks.read{color:var(--app-accent)}
.preview .ticks.read{color:var(--app-accent)}
.sender{font-weight:800;font-size:.8em;display:block;color:hsl(var(--h) 60% 42%)}
:root[data-theme="dark"] .sender{color:hsl(var(--h) 75% 72%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sender{color:hsl(var(--h) 75% 72%)}}
.quote{display:block;width:100%;text-align:left;border-radius:10px;background:rgba(120,135,175,.18);padding:6px 10px;margin-bottom:5px;font-size:.86em}
.quote b{display:block}
.reactions{position:absolute;bottom:-14px;left:8px;display:flex;gap:2px;background:var(--app-solid);color:var(--app-fg);border:1px solid var(--app-line);border-radius:99px;padding:0 7px;font-size:.82em;white-space:nowrap}
.act{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:var(--app-muted);opacity:0;flex:none}
.msg:hover .act,.act:focus-visible{opacity:1}
.act:hover{background:var(--app-solid)}
@media (hover:none){.act{opacity:.6}}
.photo{display:block;border-radius:12px;max-height:260px;width:auto;max-width:100%;margin-bottom:4px}
.filecard{display:flex;align-items:center;gap:10px;background:rgba(120,135,175,.18);padding:10px;border-radius:12px;min-width:0}
.voice{display:flex;align-items:center;gap:10px}
.play{width:34px;height:34px;border-radius:50%;background:rgba(120,135,175,.25);display:grid;place-items:center;flex:none}
.wave{display:flex;align-items:center;gap:2px;height:28px}
.wave i{width:3px;border-radius:3px;background:currentColor;opacity:.35}
.wave i.on{opacity:1}
.poll{display:grid;gap:7px;min-width:min(240px,55vw)}
.opt{position:relative;overflow:hidden;text-align:left;border:1px solid rgba(130,145,185,.4);border-radius:11px;padding:7px 10px;display:flex;justify-content:space-between;gap:10px}
.opt i{position:absolute;inset:0 auto 0 0;background:rgba(120,150,220,.28);transition:width .35s}
.opt span{position:relative}
.opt[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.typing-bubble{align-self:flex-start;display:flex;gap:4px;background:var(--app-theirs);border-radius:18px;padding:13px 15px;margin-top:4px}
.typing-bubble i{width:6px;height:6px;border-radius:50%;background:var(--app-muted);animation:blink 1.1s infinite}
.typing-bubble i:nth-child(2){animation-delay:.18s}.typing-bubble i:nth-child(3){animation-delay:.36s}
@keyframes blink{40%{transform:translateY(-4px);opacity:.4}}

.composer-wrap{padding:10px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;position:relative}
.replying{display:flex;gap:10px;align-items:center;background:var(--app-soft);border-radius:14px;padding:8px 8px 8px 14px;font-size:.88em}
.composer{display:flex;align-items:flex-end;gap:6px;background:var(--app-solid);border:1px solid var(--app-line);border-radius:22px;padding:6px;box-shadow:var(--app-shadow)}
.composer:focus-within{border-color:var(--app-accent)}
.composer textarea{flex:1;min-width:0;resize:none;border:0;background:none;outline:0;padding:8px 6px;max-height:130px;line-height:1.4}
.send{width:38px;height:38px;border-radius:14px;background:var(--app-accent);color:var(--app-on-accent);display:grid;place-items:center;flex:none;transition:transform .2s}
.send:hover{transform:scale(1.07)}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--app-danger);animation:blink 1.2s infinite;margin:0 4px 0 10px;align-self:center}
.blocked-bar{text-align:center;padding:12px;background:var(--app-soft);border-radius:16px;color:var(--app-muted)}
.emoji{position:absolute;bottom:100%;left:12px;right:12px;max-width:340px;background:var(--app-solid);border:1px solid var(--app-line);box-shadow:var(--app-shadow);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;z-index:5}
.emoji button{font-size:1.35em;border-radius:9px;padding:3px 0}
.emoji button:hover{background:var(--app-soft)}

.welcome{margin:auto;text-align:center;display:grid;gap:12px;justify-items:center;padding:24px;max-width:380px;color:var(--app-muted)}
.welcome h2{color:var(--app-fg);font-size:1.5em}
.orb{width:110px;height:110px;border-radius:50%;background:var(--app-accent-soft);color:var(--app-accent-strong);display:grid;place-items:center}
.orb svg.i{width:52px;height:52px}

.btn{padding:9px 16px;border-radius:13px;font-weight:700;background:var(--app-soft);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--app-accent);color:var(--app-on-accent)}
.btn.danger{color:var(--app-danger)}
.btn:hover{filter:brightness(1.06)}

.details{padding:0}
.details .inner{padding:16px;display:grid;gap:16px;align-content:start}
.hero{display:grid;justify-items:center;text-align:center;gap:6px}
.media{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.media img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.stack{display:grid;gap:8px}

/* settings */
.settings-nav{padding:6px 16px 20px;display:grid;justify-items:center;gap:18px}
.me-card{display:flex;align-items:center;gap:12px;width:100%;background:var(--app-soft);border-radius:18px;padding:12px}
.menu-holder{padding:0 12px}
.community{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--app-line)}
.community .avatar{border-radius:16px}
.page{padding:28px max(18px,6%);display:grid;gap:18px;align-content:start;max-width:660px;width:100%}
.card{background:var(--app-solid);border:1px solid var(--app-line);border-radius:18px;padding:6px 16px}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;flex-wrap:wrap}
.set+.set{border-top:1px solid var(--app-line)}
.set small{display:block;color:var(--app-muted)}
.field{display:grid;gap:6px;font-weight:600}
.field input,.field textarea,.field select,select.inp,input.inp{width:100%;background:var(--app-soft);border:1px solid var(--app-line);border-radius:12px;padding:10px 12px;font-weight:500}
select.inp{width:auto}
.tg{width:44px;height:26px;border-radius:99px;background:var(--app-soft);border:1px solid var(--app-line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;top:3px;left:3px;background:var(--app-muted);transition:left .2s,background .2s}
.tg[aria-checked="true"]{background:var(--app-accent)}
.tg[aria-checked="true"]::after{left:21px;background:var(--app-on-accent)}
.swatch{width:30px;height:30px;border-radius:50%;background:hsl(var(--h) 62% 50%)}
.swatch[aria-pressed="true"]{outline:2px solid var(--app-fg);outline-offset:2px}
input[type="range"]{accent-color:var(--app-accent)}

/* overlays */
.pop{position:fixed;z-index:40;min-width:190px;max-height:70vh;overflow:auto;background:var(--app-solid);border:1px solid var(--app-line);border-radius:16px;box-shadow:var(--app-shadow);padding:6px;display:grid;gap:2px}
.pop button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;font-weight:600}
.pop button:hover{background:var(--app-soft)}
.pop .danger{color:var(--app-danger)}
.pop .reacts{display:flex;gap:0}
.pop .reacts button{font-size:1.25em;padding:4px 6px}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,12,24,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--app-solid);border-radius:24px;box-shadow:var(--app-shadow);padding:20px;display:grid;gap:14px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;width:100%;text-align:left;cursor:pointer}
.pick:hover{background:var(--app-soft)}
.stage{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:18px;padding:28px 18px;color:#fff;background:linear-gradient(160deg,hsl(var(--h) 55% 28%),#080b14 75%);text-align:center}
.bars{display:flex;gap:5px;width:min(480px,100%)}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.bars b{display:block;height:100%;width:0;background:#fff}
.story{flex:1;display:grid;place-items:center;font-size:1.9em;font-weight:800;max-width:520px;min-height:0;overflow-wrap:anywhere}
.story img{max-height:60vh;border-radius:20px}
.round{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.round[aria-pressed="true"]{background:#fff;color:#111}
.round.end{background:#d93650}
.stage form{display:flex;gap:8px;width:min(480px,100%)}
.stage input{flex:1;min-width:0;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:11px 16px}
.stage input::placeholder{color:rgba(255,255,255,.7)}
.toasts{position:fixed;z-index:70;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:grid;gap:8px;justify-items:end;pointer-events:none}

.bc-switch{--color-chartreuse:hsl(var(--ah) 92% 82%);--bc-s-ink:var(--color-ink,#0e0e0c);--bc-s-paper:var(--color-paper,#f2eee5);--bc-s-bone:var(--color-bone,#fbf8f1);--bc-s-chartreuse:var(--color-chartreuse,#d8ff3d);--bc-s-tangerine:var(--color-tangerine,#ff5a1f);--bc-s-graphite:var(--color-graphite,#4a4842);display:inline-flex;align-items:center;gap:14px;cursor:pointer;user-select:none;font-family:var(--font-mono,"JetBrains Mono",ui-monospace,monospace);position:relative}
.bc-switch__input{position:absolute;opacity:0;width:0;height:0;margin:0}

/* ───── formatting ───── */
const hm = t => new Date(t).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
function dayName(t) {
  const d = new Date(t).toDateString();
  if (d === new Date().toDateString()) return "Today";
  if (d === new Date(Date.now() - DAY).toDateString()) return "Yesterday";
  return new Date(t).toLocaleDateString([], {weekday: "short", day: "numeric", month: "short"});
}
const shortWhen = t => dayName(t) === "Today" ? hm(t) : dayName(t) === "Yesterday" ? "Yesterday" : new Date(t).toLocaleDateString([], {day: "numeric", month: "short"});
const dur = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const size = b => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const initials = n => n.split(/\s+/).slice(0, 2).map(w => Array.from(w)[0] || "").join("").toUpperCase();
const hueOf = n => S.chats.find(c => c.name === n)?.hue ?? HUES[[...n].reduce((a, ch) => a + ch.charCodeAt(0), 0) % HUES.length];
const avatar = (c, cls = "") => /^\+/.test(c.name) ? `<span class="avatar anon ${cls}" aria-hidden="true">${ic("user")}</span>` : `<span class="avatar ${cls}" style="--h:${+c.hue}" aria-hidden="true">${esc(initials(c.name))}</span>`;
const summary = m => m.deleted ? "Message deleted" : m.type === "call" ? (m.video ? "Video call" : "Voice call") : m.type === "image" ? "📷 " + (m.text || "Photo") : m.type === "file" ? "📄 " + m.name : m.type === "voice" ? "🎤 Voice message " + dur(m.secs) : m.type === "poll" ? "📊 " + m.question : m.type === "contact" ? "👤 " + m.name : m.text;
const ticks = m => {
  if (m.from !== "me" || m.type === "call") return "";
  const st = m.status === "read" && !S.prefs.receipts ? "delivered" : m.status;
  return `<svg class="ticks ${st}" viewBox="0 0 18 12" role="img" aria-label="${st}"><path d="m1 6.500 3.500 3.500L11.500 2"/>${st === "sent" ? "" : '<path d="m8.500 9.500.5.500L16.500 2"/>'}</svg>`;
};

function chatRow(c, hit) {
  const list = visible(c.id), last = list[list.length - 1];
  const typing = ui.typing[c.id];
  const draft = ui.drafts[c.id];
  let prev = typing ? `${c.group ? esc(typing) + " is " : ""}typing…`
    : hit ? esc(hit.text)
    : draft && ui.chat !== c.id ? `<b>Draft:</b> ${esc(draft)}`
    : last ? `${last.type === "call" && !last.deleted ? ic(last.from === "me" ? "callout" : "call") : ticks(last)} ${c.group && last.from !== "me" && last.from !== "system" ? esc(last.from.split(" ")[0]) + ": " : ""}${esc(summary(last))}` : "No messages yet";
  return `<div class="item ${ui.chat === c.id && ui.view === "chats" ? "active" : ""}">
    <button class="open" data-act="open" data-id="${c.id}" ${hit ? `data-mid="${hit.id}"` : ""} aria-label="Open chat with ${esc(c.name)}${c.unread ? `, ${c.unread} unread` : ""}"></button>
    ${avatar(c, (() => { const st = S.statuses.find(x => x.who === c.id); return st ? "ring " + (st.seen ? "seen" : "") : c.online && !c.blocked ? "online" : ""; })())}
    <div class="body">
      <div class="line1"><span class="name">${esc(c.name)}</span><span class="time">${last ? shortWhen(last.ts) : ""}</span></div>
      <div class="line2"><span class="preview ${typing ? "typing" : ""}">${prev}</span><span class="mini row">${c.muted ? ic("mute") : ""}${c.pinned ? ic("pin") : ""}</span>${c.unread ? `<span class="pill">${c.unread}</span>` : ""}<button class="more" data-act="chatmenu" data-id="${c.id}" aria-label="Options for ${esc(c.name)}">${ic("down")}</button></div>
    </div></div>`;
}

      .filter(c => ui.filter === "unread" ? c.unread : ui.filter === "fav" ? c.fav : ui.filter === "group" ? c.group : ui.filter.startsWith("list:") ? S.lists.find(l => "list:" + l.id === ui.filter)?.ids.includes(c.id) : true)
      .sort((a, z) => (z.pinned - a.pinned) || lastTs(z) - lastTs(a));

      html = (names.length ? `<div class="label section-label">Chats</div>${names.map(c => chatRow(c)).join("")}` : "") + (hits.length ? `<div class="label section-label">Messages</div>${hits.map(([c, h]) => chatRow(c, h)).join("")}` : "");

/* ───── actions ───── */
function openChat(id, mid) {
  const c = chatOf(id); if (!c) return;
  if (ui.chat !== id) { ui.reply = ui.edit = null; ui.find = null; ui.emoji = false; stopRec(); }
  ui.chat = id; c.unread = 0;
  if (ui.view !== "chats") { ui.view = "chats"; ui.archived = c.archived; renderHead(); }
  $("#app").classList.add("show-main");
  save(); refreshList(); renderMain();
  if (mid) jump(mid);
}
function jump(mid) {
  const el = document.getElementById("m-" + mid); if (!el) return;
  el.scrollIntoView({block: "center"});
  const b = el.querySelector(".bubble"); b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 1600);
}
function setView(v) {
  ui.view = v; ui.archived = false; ui.emoji = false; stopRec();
  $("#app").classList.remove("show-main");
  renderHead(); refreshList(); renderMain();
}
function push(cid, msg) {
  const c = chatOf(cid);
  const m = {id: uid(), type: "text", ts: Date.now(), status: "sent", ...msg};
  if (c.expire && m.from !== "system") m.expires = m.ts + c.expire;
  (S.msgs[cid] ||= []).push(m); ui.fresh.add(m.id); save(); return m;
}
function send(cid, msg) {
  const c = chatOf(cid); if (!c || c.blocked) return;
  const m = push(cid, {from: "me", ...msg});
  c.archived = false;
  if (ui.chat === cid) renderMsgs(true);
  refreshList();
  setTimeout(() => { m.status = "delivered"; sync(cid); }, 600);
  simulate(cid, m);
}
function sync(cid) { save(); if (ui.chat === cid && ui.view !== "settings") renderMsgs(); if (ui.view === "chats" || ui.view === "communities") renderList(); }
const replyTimers = {};
function simulate(cid, sent) {
  clearTimeout(replyTimers[cid]);
  replyTimers[cid] = setTimeout(() => {
    const c = chatOf(cid); if (!c || c.blocked) return;
    const who = c.group ? c.members[Math.floor(Math.random() * c.members.length)] : c.name;
    if (!who) return;
    (S.msgs[cid] || []).forEach(m => { if (m.from === "me") m.status = "read"; });
    ui.typing[cid] = who.split(" ")[0]; if (!c.group) c.online = true;
    sync(cid); renderPresence();
    replyTimers[cid] = setTimeout(() => {
      delete ui.typing[cid];
      if (!chatOf(cid) || c.blocked) return;
      const t = (sent.text || "").toLowerCase();
      const pick = a => a[Math.floor(Math.random() * a.length)];
      const text = sent.type === "image" ? pick(["Love this one 😍", "Great shot!"]) : sent.type === "file" ? "Got the file, thanks." : sent.type === "voice" ? "Listening now 🎧" : sent.type === "poll" ? "Good question. Voting now."
        : /\b(hi|hello|hey|hola)\b/.test(t) ? "Hey! How's your day going?" : t.includes("?") ? pick(["Let me check and get back to you.", "I think so! Give me ten minutes.", "Good question 🤔"]) : /thank|gracias/.test(t) ? "Anytime 🙌" : pick(["Sounds good 👍", "Nice, noted.", "On it.", "Haha, agreed."]);
      const m = push(cid, {from: who, text});
      if (sent.type === "poll") { const p = msgOf(cid, sent.id); p?.options[0].v.push(who); }
      const seen = ui.chat === cid && ui.view === "chats" && !document.hidden && (window.innerWidth > 760 || $("#app").classList.contains("show-main"));
      if (!seen) { c.unread++; if (!c.muted) { if (S.prefs.toasts) toast(`${c.name}: ${S.prefs.preview ? m.text : "New message"}`, cid, c); beep(); } }
      sync(cid); renderRail(); renderPresence();
    }, 1500);
  }, 1300);
}
let audio;
function beep() {
  if (!S.prefs.sound) return;
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 720;
    g.gain.setValueAtTime(.08, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .25);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .26);
  } catch (e) { /* sound is optional */ }
}
function toast(text, cid, c) {

}
function submitText() {
  const t = $("#text"), c = chatOf(ui.chat); if (!t || !c) return;
  const text = t.value.trim();
  if (!text) { if (ui.edit) toast("A message can't be empty. Cancel the edit or delete it."); return; }
  ui.drafts[c.id] = "";
  if (ui.edit) { const m = msgOf(c.id, ui.edit); if (m && m.text !== text) { m.text = text; m.edited = true; } ui.edit = null; sync(c.id); }
  else { const replyTo = ui.reply; ui.reply = null; ui.emoji = false; send(c.id, {text, ...(replyTo ? {replyTo} : {})}); }

}

/* voice */

let playTimer;
function play(mid) {
  clearInterval(playTimer);
  if (ui.playing?.id === mid) { ui.playing = null; renderMsgs(); return; }
  const m = msgOf(ui.chat, mid); ui.playing = {id: mid, p: 0}; renderMsgs();
  playTimer = setInterval(() => {
    if (!ui.playing) return clearInterval(playTimer);
    ui.playing.p += .1 / Math.max(m.secs, 1);
    if (ui.playing.p >= 1) { clearInterval(playTimer); ui.playing = null; renderMsgs(); return; }
    document.querySelectorAll(`[data-wave="${mid}"] i`).forEach((i, n) => i.classList.toggle("on", n / 26 < ui.playing.p));
  }, 100);
}

/* files */
function pickFile(accept, fn) {
  const f = $("#filePick"); f.accept = accept; f.value = "";
  f.onchange = () => f.files[0] && fn(f.files[0]); f.click();

function readImage(file, fn) {
  const r = new FileReader();
  r.onerror = () => toast("That file couldn't be read. Try another one.");
  r.onload = () => {
    const img = new Image();
    img.onerror = () => toast("That image format isn't supported. Try a JPG or PNG.");
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
      const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      fn(cv.toDataURL("image/jpeg", .8));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function sendImage(cid, file) {
  readImage(file, src => modal("Send photo", `<img class="photo" src="${src}" alt="Selected photo" style="justify-self:center"><label class="field">Caption<input id="caption" maxlength="200" placeholder="Optional"></label>`, "Send", () => { send(cid, {type: "image", src, text: val("caption")}); }));

function closeStage() { clearInterval(stageTimer); stageTimer = null; const f = stageEnd; stageEnd = null; $("#stage").hidden = true; f?.(); }
function showStory(who, items, replyTo) {
  let i = 0, p = 0, paused = false;
  const draw = () => {
    openStage(who.hue, `<div class="bars">${items.map((_, n) => `<i><b style="width:${n < i ? 100 : 0}%"></b></i>`).join("")}</div>
      <div class="row">${avatar(who, "sm")}<span><b>${esc(who.name)}</b><br><small>${hm(items[i].ts)}</small></span><button class="round" data-act="storypause" aria-label="Pause" aria-pressed="false">${ic("pause")}</button><button class="round" data-act="closestage" aria-label="Close status">${ic("close")}</button></div>
      <div class="story">${items[i].src ? `<img src="${esc(items[i].src)}" alt="Status photo">` : esc(items[i].text)}</div>
      ${replyTo ? `<form id="storyReply"><input id="storyText" placeholder="Reply to ${esc(who.name.split(" ")[0])}" aria-label="Reply"><button class="round" aria-label="Send reply">${ic("send")}</button></form>` : '<span></span>'}`);
    $("#storyText")?.addEventListener("focus", () => paused = true);
    $("#storyReply")?.addEventListener("submit", e => { e.preventDefault(); const t = val("storyText"); if (!t) return; send(replyTo, {text: `Re: status “${(items[i].text || "photo").slice(0, 40)}”\n${t}`}); closeStage(); toast("Reply sent"); });
  };
  clearInterval(stageTimer); draw();

    <div class="hero" style="margin:auto">${avatar(c, "lg")}<h1>${esc(c.name)}</h1><p id="callState" role="status">Ringing…</p></div>

/* in-chat search */
function markFind(move) {
  const c = chatOf(ui.chat); if (!c || !ui.find) return;
  const q = ui.find.q.trim().toLowerCase();
  const hits = q ? visible(c.id).filter(m => !m.deleted && m.from !== "system" && String(summary(m)).toLowerCase().includes(q)) : [];
  ui.find.i = Math.max(0, Math.min(ui.find.i, hits.length - 1));
  const el = $("#findCount"); if (el) el.textContent = q ? (hits.length ? `${ui.find.i + 1} of ${hits.length}` : "No matches") : "";
  document.querySelectorAll(".bubble.hit").forEach(b => b.classList.remove("hit"));
  const m = hits[hits.length - 1 - ui.find.i]; if (!m) return;
  const node = document.getElementById("m-" + m.id); node?.querySelector(".bubble").classList.add("hit");
  if (move) node?.scrollIntoView({block: "center"});
}

  findprev: () => { if (ui.find) { ui.find.i++; markFind(true); } },
  findnext: () => { if (ui.find) { ui.find.i--; markFind(true); } },
  newstatus: () => modal("Add status", `<label class="field">What's new?<textarea id="stText" rows="3" maxlength="160"></textarea></label><button type="button" class="btn" data-act="photostatus">${ic("image")}Use a photo instead</button>`, "Share", () => { const t = val("stText"); if (!t) return fail("Write something or choose a photo."); S.mine.push({text: t, ts: Date.now()}); save(); if (ui.view === "status") renderList(); toast("Status added"); }),
  photostatus: () => pickFile("image/*", f => readImage(f, src => { S.mine.push({src, text: "", ts: Date.now()}); save(); closeModal(); if (ui.view === "status") renderList(); toast("Status added"); })),
  mystory: (d, el) => showPop(el, item("viewmine", "status", "View my status") + item("newstatus", "plus", "Add another") + item("delstatus", "trash", "Delete my status", "", "danger")),
  viewmine: () => showStory({...S.me, name: "My status"}, S.mine.filter(i => i.ts > Date.now() - DAY), null),
  delstatus: () => { S.mine = []; save(); renderList(); },
  story: d => { const s = S.statuses[+d.i], c = chatOf(s.who); s.seen = true; save(); refreshList(); showStory(c, s.items, c.blocked ? null : c.id); },
  storypause: () => ui.pauseStory?.(),
  closestage: closeStage,
  call: d => startCall(d.id, !!d.video),
  newcall: () => pickChat("Start a call", id => startCall(id, false)),
  calltoggle: (d, el) => el.setAttribute("aria-pressed", el.getAttribute("aria-pressed") !== "true"),
  section: d => { ui.section = d.v; document.querySelectorAll(".u-menu__item").forEach(b => b.setAttribute("aria-current", b.dataset.v === d.v)); syncFoot(); $("#app").classList.add("show-main"); renderSettings(); },
  hue: d => { S.me.hue = +d.v; const n = val("pName"), a = val("pAbout"); save(); renderSettings(); $("#pName").value = n; $("#pAbout").value = a; renderList(); },
  pref: (d, el) => { S.prefs[d.k] = !S.prefs[d.k]; el.setAttribute("aria-checked", S.prefs[d.k]); save(); applyPrefs(); if (d.k === "sound") beep(); },
  reset: () => confirmBox("Reset the demo?", "Your messages and settings in this browser will be erased.", "Reset", () => { Object.values(replyTimers).forEach(clearTimeout); const theme = S.prefs.theme; S = seed(); S.prefs.theme = theme; ui.filter = "all"; ui.typing = {}; ui.drafts = {}; ui.chat = null; save(); applyPrefs(); setView("chats"); toast("Demo reset"); })
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  const inPop = e.target.closest("#pop");
  if (!inPop) closePop();
  if (ui.emoji && !e.target.closest(".emoji,[data-act='emojis'],#text")) { ui.emoji = false; document.querySelector(".emoji")?.remove(); document.querySelector('[data-act="emojis"]')?.setAttribute("aria-pressed", "false"); }
  if (e.target === $("#scrim")) return closeModal();
  if (!el) return;
  const d = {...el.dataset};
  if (inPop) closePop();
  actions[d.act]?.(d, el);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "modalForm" && modalSubmit) { const f = modalSubmit; if (f() !== false) closeModal(); }
  if (e.target.id === "profileForm") { const n = val("pName"); if (!n) return toast("Enter your name before saving."); S.me.name = n; S.me.about = val("pAbout"); save(); renderList(); renderSettings(); toast("Profile saved"); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { ui.q = t.value; renderList(); }
  else if (t.id === "text") {
    ui.drafts[ui.chat] = t.value; autosize();
    const b = $("#sendBtn"), has = !!t.value.trim() || !!ui.edit;
    if (b.dataset.act !== (has ? "send" : "record")) { b.dataset.act = has ? "send" : "record"; b.setAttribute("aria-label", has ? "Send" : "Record voice message"); b.innerHTML = ic(has ? "send" : "mic"); }
  }
  else if (t.id === "findInput") { ui.find = {q: t.value, i: 0}; markFind(true); }
  else if (t.id === "scale") { S.prefs.scale = +t.value; $("#scaleOut").textContent = Math.round(t.value * 100) + "%"; save(); applyPrefs(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.classList.contains("bc-switch__input")) { S.prefs.theme = t.checked ? "dark" : "light"; document.documentElement.dataset.theme = S.prefs.theme; save(); syncSwitches(); }
  else if (t.id === "wall") { S.prefs.wall = t.value; save(); applyPrefs(); }
  else if (t.id === "expire") { const c = chatOf(ui.chat); c.expire = +t.value; push(c.id, {from: "system", text: c.expire ? `New messages disappear after ${t.selectedOptions[0].text}` : "Disappearing messages turned off"}); sync(c.id); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (!$("#pop").hidden) closePop(); else if (!$("#scrim").hidden) closeModal(); else if (!$("#stage").hidden) closeStage();
    else if (ui.emoji) actions.emojis(); else if (ui.find) actions.findclose(); else if (ui.reply || ui.edit) actions.cancelreply(); else if (ui.details) actions.details();
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (!$("#scrim").hidden || !$("#stage").hidden) return; setView("chats"); $("#q").focus(); }
  if (e.target.id === "text" && e.key === "Enter" && !e.shiftKey && !e.isComposing && S.prefs.enter) { e.preventDefault(); submitText(); }
  if (e.target.id === "findInput" && e.key === "Enter") { e.preventDefault(); actions[e.shiftKey ? "findnext" : "findprev"](); }
});
document.addEventListener("paste", e => {
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
  if (f && e.target.id === "text") { e.preventDefault(); sendImage(ui.chat, f); }
});
const main = $("#main");
main.addEventListener("dragover", e => { if (e.dataTransfer.types.includes("Files")) e.preventDefault(); });
main.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0]; if (!f) return; e.preventDefault();
  const c = chatOf(ui.chat); if (!c || c.blocked || ui.view !== "chats") return;
  f.type.startsWith("image/") ? sendImage(c.id, f) : send(c.id, {type: "file", name: f.name, size: f.size});
});

/* ───── start ───── */
$("#listFoot").innerHTML = switchHTML("themeMain");
applyPrefs(); renderHead(); renderRail(); renderList(); renderMain();
if (window.innerWidth > 760) openChat("maya");
})();
</script>
</body>
</html>
